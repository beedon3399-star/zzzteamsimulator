saveCustom(){localStorage.setItem(CUSTOM_KEY,JSON.stringify(customAgents))}function loadConv(){try{const x=JSON.parse(localStorage.getItem('zzz-agent-conv-v2'));return x&&typeof x==='object'?x:{}}catch(e){return {}}}function saveConv(){localStorage.setItem('zzz-agent-conv-v2',JSON.stringify(convData))}function loadRule(){try{const v=localStorage.getItem(RULE_KEY);return v===null?true:v==='true'}catch(e){return true}}function saveRule(){localStorage.setItem(RULE_KEY,String(noOverlap));updateRuleButton() }function updateRuleButton(){const b=$('ruleToggle');if(b)b.textContent=noOverlap?'マトリクスモード:ON':'マトリクスモード:OFF(被りあり)'} function loadConvDisplay(){try{const v=localStorage.getItem(CONV_DISPLAY_KEY);return v===null?true:v==='true'}catch(e){return true}}function saveConvDisplay(){localStorage.setItem(CONV_DISPLAY_KEY,String(showConv));updateConvDisplayButton()}function updateConvDisplayButton(){const b=$('convDisplayToggle');if(b)b.textContent=showConv?'凸表示:ON':'凸表示:OFF'} function convText(n){const c=convData[n]||{char:0,weapon:0,weaponName:''};return `M${Math.max(0,Math.min(6,c.char||0))}${c.weaponName ? c.weaponName : ''}W${Math.max(1,Math.min(5,(c.weapon||0)+1))}`}function getGroupCount(){return Math.ceil(teams.length/3)}function allAgents(){return customAgents.concat(AGENTS)}function groupOf(ti){return Math.floor(ti/3)}function groupName(g){return `グループ${g+1}`}function uses(n){return teams.flat().filter(x=>x&&x[1]===n).length}function usesInGroup(n,g){return teams.slice(g*3,g*3+3).flat().filter(x=>x&&x[1]===n).length}function maxUses(a){return a[2]==='支援'||a[2]==='防護'?2:1}function canAdd(a){const g=groupOf(active);if(!noOverlap)return usesInGroup(a[1],g)<1;if(a[2]==='支援'||a[2]==='防護')return uses(a[1])<2&&usesInGroup(a[1],g)<1;return uses(a[1])<1}function initial(n){return n.replace(/[「」・＆&]/g,'').trim().slice(0,1)||'？'}function img(a,c){if(a[0].startsWith('data:'))return `<img class="${c}" src="${a[0]}" alt="${a[1]}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="initial" style="display:none">${initial(a[1])}</div>`;return `<img class="${c}" src="${IMAGE_BASE}${encodeURIComponent(a[0])}" alt="${a[1]}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="initial" style="display:none">${initial(a[1])}</div>`}function renderTeams(){const groupHeaders=Array.from({length:getGroupCount()},(_,i)=>i*3);$('groupCount').textContent=`グループ${getGroupCount()}`;let out='';teams.forEach((t,ti)=>{if(groupHeaders.includes(ti))out+=`<div class="groupLabel" style="grid-column:1/-1">${groupName(groupOf(ti))}</div>`;out+=`<article class="team ${ti===active?'active':''}" data-team="${ti}"><div class="teamhead"><b>チーム${ti+1}</b></div><div class="slots">${t.map((a,si)=>a?`<button class="slot" data-slot="${ti},${si}" title="クリックして外す">${img(a,'slotImage')}<strong>${a[1]}</strong>${showConv?`<span class="meta2">${convText(a[1])}</span>`:``}</button>`:`<button class="slot empty" data-slot="${ti},${si}"></button>`).join('')}</div></article>`});$('teams').innerHTML=out;document.querySelectorAll('.team[data-team]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-slot]'))return;active=+b.dataset.team;$('status').textContent=`チーム${active+1}を選択中。`;render()});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const [ti,si]=b.dataset.slot.split(',').map(Number);if(teams[ti][si]){const n=teams[ti][si][1];teams[ti][si]=null;active=ti;save();$('status').textContent=`${n}をチーム${ti+1}から外しました。`;render()}else{active=ti;$('status').textContent=`チーム${active+1}を選択中。`;render()}})}function add(i){const a=allAgents()[i];if(!canAdd(a)){const g=groupOf(active);$('status').textContent=(a[2]==='支援'||a[2]==='防護')?`${a[1]}は${groupName(g)}ですでに使用されています。別グループでは使用できます。`:`${a[1]}はすでに使用されています。`;return}const s=teams[active].findIndex(x=>x===null);if(s<0){$('status').textContent=`チーム${active+1}は満員です。`;return}teams[active][s]=a;save();$('status').textContent=`${a[1]}をチーム${active+1}に追加しました。`;if(teams[active].every(Boolean)&&active<teams.length-1)active++;render()}function renderChars(){
 const list=allAgents(),q=$('search').value.trim().toLowerCase(),sp=$('specialty').value,ra=$('rarity').value;
 const f=list.map((a,i)=>({a,i})).filter(x=>(!q||x.a[1].toLowerCase().includes(q))&&(sp==='all'||x.a[2]===sp)&&(ra==='all'||x.a[3]===ra));
 $('count').textContent=`${f.length}人表示 / 全${list.length}人（追加${customAgents.length}人）`;
 $('chars').innerHTML=f.map(({a,i})=>{
   const g=groupOf(active),isShared=(a[2]==='支援'||a[2]==='防護'),u=uses(a[1]),ug=usesInGroup(a[1],g),m=isShared?2:1,d=!canAdd(a);
   return `<div class="char ${d?'used':''}" data-agent="${i}">${img(a,'charImage')}<strong>${a[1]}</strong><span class="meta">${a[2]} / ${a[3]}級　${noOverlap?`${u}/${m}${isShared?`（このグループ${ug}/1）`:''}`:''}</span>${showConv?`<span class="meta2">${convText(a[1])}</span>`:``}<button class="conv" type="button" data-conv="${i}">凸設定</button>${i<customAgents.length?`<button class="deleteAgent" type="button" data-delete-custom="${i}">削除</button>`:''}</div>`
 }).join('');
}
function deleteCustomDirect(i){
 const idx=Number(i); if(!Number.isInteger(idx)||idx<0||idx>=customAgents.length)return;
 const a=customAgents[idx]; if(!a)return; const name=a[1];
 customAgents.splice(idx,1); saveCustom();
 teams=teams.map(t=>t.map(x=>x&&x[1]===name?null:x));
 delete convData[name]; save(); saveConv();
 if(active>=teams.length)active=teams.length-1;
 $('status').textContent=`${name}を削除しました。`; render();
}
let deleteTarget=-1;
function openDelete(i){
 const idx=Number(i); if(!Number.isInteger(idx)||idx<0||idx>=customAgents.length)return;
 deleteTarget=idx; const name=customAgents[idx][1];
 $('deleteMessage').innerHTML=`「<strong>${name}</strong>」を削除しますか？<br><span class="smallNote">削除すると、このブラウザに追加したエージェントの登録がなくなります。編成中の場合は編成からも外れます。</span>`;
 $('deleteModal').classList.add('show'); $('deleteModal').setAttribute('aria-hidden','false');
}
function closeDelete(){deleteTarget=-1;$('deleteModal').classList.remove('show');$('deleteModal').setAttribute('aria-hidden','true')}
function openConv(i){
 const a=allAgents()[Number(i)]; if(!a)return; convTarget=a[1];
 const c=convData[convTarget]||{char:0,weapon:0,weaponName:''};
 $('convTitle').textContent=`${convTarget}の凸数を設定`;
 $('charConv').value=String(Math.max(0,Math.min(6,c.char||0)));
 $('weaponName').value=c.weaponName||'';
 $('weaponConv').value=String(Math.max(0,Math.min(4,c.weapon||0)));
 $('convModal').classList.add('show'); $('convModal').setAttribute('aria-hidden','false');
}
function closeConv(){convTarget='';$('convModal').classList.remove('show');$('convModal').setAttribute('aria-hidden','true')}
function render(){renderTeams();renderChars();updateRuleButton();updateConvDisplayButton()}
$('chars').addEventListener('click',e=>{
 const del=e.target.closest('[data-delete-custom]');
 if(del){e.preventDefault();e.stopPropagation();openDelete(Number(del.dataset.deleteCustom));return}
 const conv=e.target.closest('[data-conv]');
 if(conv){e.preventDefault();e.stopPropagation();openConv(Number(conv.dataset.conv));return}
 const card=e.target.closest('[data-agent]'); if(!card||e.target.closest('button'))return;
 const i=Number(card.dataset.agent),a=allAgents()[i]; if(a&&!card.classList.contains('used'))add(i);
});
$('cancelDelete').onclick=closeDelete;
$('deleteModal').onclick=e=>{if(e.target.id==='deleteModal')closeDelete()};
$('confirmDelete').onclick=()=>{if(deleteTarget>=0){const idx=deleteTarget;closeDelete();deleteCustomDirect(idx)}};
$('cancelConv').onclick=closeConv;
$('convModal').onclick=e=>{if(e.target.id==='convModal')closeConv()};
$('saveConv').onclick=()=>{if(!convTarget)return;convData[convTarget]={char:Number($('charConv').value)||0,weapon:Number($('weaponConv').value)||0,weaponName:$('weaponName').value.trim()};saveConv();closeConv();$('status').textContent=`${convTarget}の凸設定を保存しました。`;render()};
$('addCharacter').onclick=()=>{$('addModal').classList.add('show');$('addModal').setAttribute('aria-hidden','false')};
$('cancelAdd').onclick=()=>{$('addModal').classList.remove('show');$('addModal').setAttribute('aria-hidden','true')};
$('addModal').onclick=e=>{if(e.target.id==='addModal'){$('addModal').classList.remove('show');$('addModal').setAttribute('aria-hidden','true')}};
$('saveAdd').onclick=()=>{
 const name=$('newName').value.trim(),role=$('newRole').value,rarity=$('newRarity').value,file=$('newImage').files[0];
 if(!name){alert('キャラクター名を入力してください。');return}
 if(!file){alert('キャラクター画像を選択してください。');return}
 if(file.size>2*1024*1024){alert('画像は2MB以下にしてください。');return}
 const reader=new FileReader();
 reader.onload=()=>{customAgents.unshift([String(reader.result),name,role,rarity]);saveCustom();$('newName').value='';$('newImage').value='';$('addModal').classList.remove('show');$('addModal').setAttribute('aria-hidden','true');$('status').textContent=`${name}を追加しました。`;render()};
 reader.readAsDataURL(file);
};
$('reset').onclick=()=>{if(!confirm('編成と凸設定をすべてリセットします。よろしいですか？'))return;teams=Array.from({length:9},()=>[null,null,null]);convData={};active=0;save();saveConv();render();$('status').textContent='すべてリセットしました。'};

$('removeGroup').onclick=()=>{const gc=getGroupCount();if(gc<=1){alert('グループは1つ以上必要です。');return}const removed=teams.slice(-3);if(removed.some(t=>t.some(Boolean))&&!confirm(`グループ${gc}の編成を削除します。よろしいですか？`))return;teams.splice(-3,3);if(active>=teams.length)active=teams.length-1;save();render();$('status').textContent=`グループ${gc}を削除しました。`};
$('addGroup').onclick=()=>{const gc=getGroupCount();if(gc>=9){alert('グループは最大9つまでです。');return}teams.push([null,null,null],[null,null,null],[null,null,null]);save();render();active=teams.length-3;$('status').textContent=`グループ${getGroupCount()}を追加しました。`;render()};
$('ruleToggle').onclick=()=>{noOverlap=!noOverlap;saveRule();render()};$('convDisplayToggle').onclick=()=>{showConv=!showConv;saveConvDisplay();render()};
